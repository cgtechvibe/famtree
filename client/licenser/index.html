<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>License Manager</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #121212; }
        #app { position: fixed; inset: 0; }
        #app iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>
    <div id="app">
        <iframe src="https://script.google.com/macros/s/AKfycbyYS0eZPd9Cgm5SClaQcHvO8uyIsLwNUiG-jzlg3A8a9YAEmYdsWX41aCCfeJQ2RHOQVA/exec" allow="camera; microphone; geolocation"></iframe>
    </div>
    <script>
        window.addEventListener("load", function () {
            if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});
        });
    </script>
</body>
</html>
